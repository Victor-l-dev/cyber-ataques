<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Monitor -->
  <rect x="55" y="55" width="210" height="140" rx="6" stroke="#1c1b2e" stroke-width="2"/>
  <rect x="66" y="66" width="188" height="118" fill="#efe9fd">
    <animate attributeName="fill" values="#efe9fd;#efe9fd;#e6edfe;#efe9fd;#efe9fd" keyTimes="0;0.88;0.92;0.96;1" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Glitch bars -->
  <rect x="66" y="80" width="188" height="10" fill="#6d28d9">
    <animate attributeName="x" values="66;58;71;62;68;66" keyTimes="0;0.15;0.3;0.55;0.75;1" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.5;.9;.4;.85;1" keyTimes="0;0.15;0.3;0.55;0.75;1" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="66" y="104" width="140" height="8" fill="#1d4ed8">
    <animate attributeName="x" values="66;71;58;68;62;66" keyTimes="0;0.15;0.3;0.55;0.75;1" dur="2.6s" begin="0.35s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.5;.9;.4;.85;1" keyTimes="0;0.15;0.3;0.55;0.75;1" dur="2.6s" begin="0.35s" repeatCount="indefinite"/>
  </rect>
  <rect x="66" y="126" width="188" height="14" fill="#6d28d9" opacity="0.7">
    <animate attributeName="x" values="66;60;72;64;69;66" keyTimes="0;0.15;0.3;0.55;0.75;1" dur="2.6s" begin="0.7s" repeatCount="indefinite"/>
  </rect>
  <rect x="66" y="150" width="100" height="8" fill="#1d4ed8">
    <animate attributeName="x" values="66;73;59;67;61;66" keyTimes="0;0.15;0.3;0.55;0.75;1" dur="2.6s" begin="1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.5;.9;.4;.85;1" keyTimes="0;0.15;0.3;0.55;0.75;1" dur="2.6s" begin="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Scanlines -->
  <path d="M66 96 H254" stroke="#1d4ed8" stroke-width="1.4">
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.4;0.42;0.9;0.92;1" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <path d="M66 166 H254" stroke="#6d28d9" stroke-width="1.4">
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.4;0.42;0.9;0.92;1" dur="1.8s" begin="0.5s" repeatCount="indefinite"/>
  </path>

  <!-- Noise flash overlay -->
  <rect x="66" y="66" width="188" height="118" fill="#1c1b2e" opacity="0">
    <animate attributeName="opacity" values="0;0;.14;0;.18;0;0" keyTimes="0;0.9;0.92;0.94;0.96;0.98;1" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Monitor stand -->
  <path d="M140 195 H180 V214 H140 Z" stroke="#1c1b2e" stroke-width="2"/>
  <path d="M108 214 H212" stroke="#1c1b2e" stroke-width="2" stroke-linecap="round"/>

  <!-- Error text with blinking cursor -->
  <text x="76" y="180" font-family="IBM Plex Mono, monospace" font-size="13" fill="#1c1b2e">ERR_0x7F<tspan>&#9608;</tspan></text>
  <rect x="150" y="169" width="9" height="13" fill="#1c1b2e">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
