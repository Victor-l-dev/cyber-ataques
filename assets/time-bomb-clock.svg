<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <style>
    .mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
  </style>

  <!-- Header label -->
  <text x="160" y="34" text-anchor="middle" class="mono" font-size="9.5" letter-spacing="1.5" fill="#5d5c74" font-weight="500">GATILHO TEMPORAL</text>

  <!-- Outer shockwave / pulse on trigger -->
  <circle cx="160" cy="160" r="96" stroke="#1d4ed8" stroke-width="1.8" fill="none" opacity="0">
    <animate attributeName="r" values="96;96;135;150" keyTimes="0;0.75;0.92;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.75;0" keyTimes="0;0.75;0.82;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#1d4ed8;#1d4ed8;#6d28d9;#1d4ed8" keyTimes="0;0.75;0.85;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Clock background -->
  <circle cx="160" cy="160" r="96" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/>

  <!-- Flash background on detonation/trigger -->
  <circle cx="160" cy="160" r="95" fill="#e6edfe" opacity="0">
    <animate attributeName="opacity" values="0;0;0.65;0.1;0.4;0" keyTimes="0;0.74;0.77;0.82;0.87;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#e6edfe;#e6edfe;#efe9fd;#efe9fd;#e6edfe;#e6edfe" keyTimes="0;0.74;0.78;0.85;0.9;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Inner radar/progress arc -->
  <circle cx="160" cy="160" r="86" stroke="#c7d7fc" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
  
  <!-- Active countdown progress circle -->
  <circle cx="160" cy="160" r="86" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round" fill="none"
          stroke-dasharray="540.35" stroke-dashoffset="540.35" transform="rotate(-90 160 160)">
    <animate attributeName="stroke-dashoffset" values="540.35;0;0" keyTimes="0;0.75;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#1d4ed8;#1d4ed8;#6d28d9;#1d4ed8" keyTimes="0;0.65;0.75;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Hour ticks (12h, 3h, 6h, 9h) -->
  <path d="M160 66 V78" stroke="#1d4ed8" stroke-width="1.8"/>
  <path d="M254 160 H242" stroke="#1d4ed8" stroke-width="1.8"/>
  <path d="M160 254 V242" stroke="#1d4ed8" stroke-width="1.8"/>
  <path d="M66 160 H78" stroke="#1d4ed8" stroke-width="1.8"/>

  <!-- Intermediate ticks (30 deg intervals) -->
  <g stroke="#1d4ed8" stroke-width="1.2" opacity="0.45">
    <line x1="208" y1="77" x2="202" y2="87" />
    <line x1="243" y1="112" x2="233" y2="118" />
    <line x1="243" y1="208" x2="233" y2="202" />
    <line x1="208" y1="243" x2="202" y2="233" />
    <line x1="112" y1="243" x2="118" y2="233" />
    <line x1="77" y1="208" x2="87" y2="202" />
    <line x1="77" y1="112" x2="87" y2="118" />
    <line x1="112" y1="77" x2="118" y2="87" />
  </g>

  <!-- Digital Countdown Box -->
  <rect x="110" y="196" width="100" height="22" rx="4" fill="#e6edfe" stroke="#1d4ed8" stroke-width="1.2">
    <animate attributeName="fill" values="#e6edfe;#e6edfe;#efe9fd;#efe9fd;#e6edfe" keyTimes="0;0.74;0.77;0.95;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#1d4ed8;#1d4ed8;#6d28d9;#6d28d9;#1d4ed8" keyTimes="0;0.74;0.77;0.95;1" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Digital Countdown Texts (Step Sequence) -->
  <!-- T-03 -->
  <text x="160" y="211" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#1d4ed8">
    <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.24;0.25;0.99;1" dur="4s" repeatCount="indefinite"/>
    T-00:03
  </text>
  <!-- T-02 -->
  <text x="160" y="211" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#1d4ed8" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.50;1" dur="4s" repeatCount="indefinite"/>
    T-00:02
  </text>
  <!-- T-01 -->
  <text x="160" y="211" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#1d4ed8" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.50;0.74;0.75;1" dur="4s" repeatCount="indefinite"/>
    T-00:01
  </text>
  <!-- TRIGGER / EXEC -->
  <text x="160" y="211" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#6d28d9" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.75;0.96;1" dur="4s" repeatCount="indefinite"/>
    EXEC_PAYLOAD
  </text>

  <!-- Hour hand (static pointing towards 12h/target) -->
  <path d="M160 160 L160 112" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>

  <!-- Minute hand (sweeps from 270 deg to 360/0 deg) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="270 160 160; 360 160 160; 360 160 160" keyTimes="0; 0.75; 1" dur="4s" repeatCount="indefinite"/>
    <path d="M160 160 L160 86" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Second hand (fast smooth sweep) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 160 160" to="720 160 160" dur="4s" repeatCount="indefinite"/>
    <path d="M160 176 L160 72" stroke="#6d28d9" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="160" cy="176" r="2.2" fill="#6d28d9"/>
  </g>

  <!-- Center Pin -->
  <circle cx="160" cy="160" r="4.5" fill="#1d4ed8"/>
  <circle cx="160" cy="160" r="2" fill="#ffffff"/>

  <!-- 12h Trigger Beacon / Sensor -->
  <!-- Pulsing ripple at beacon -->
  <circle cx="160" cy="66" r="4" stroke="#1d4ed8" stroke-width="1.4" fill="none" opacity="0">
    <animate attributeName="r" values="4;16;22" keyTimes="0;0.6;1" dur="1.33s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0" keyTimes="0;0.6;1" dur="1.33s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#1d4ed8;#6d28d9;#1d4ed8" keyTimes="0;0.75;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- Beacon circle -->
  <circle cx="160" cy="66" r="4.5" fill="#e0edff" stroke="#1d4ed8" stroke-width="1.6">
    <animate attributeName="fill" values="#e0edff;#e0edff;#6d28d9;#e0edff" keyTimes="0;0.74;0.76;0.95" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#1d4ed8;#1d4ed8;#6d28d9;#1d4ed8" keyTimes="0;0.74;0.76;0.95" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Bottom Job Status / Subtext -->
  <text x="160" y="286" text-anchor="middle" class="mono" font-size="10.5" fill="#1d4ed8" font-weight="500">
    CRON: 02:00:00 [DOM]
  </text>
  <!-- Blinking status dot -->
  <circle cx="236" cy="283" r="2.5" fill="#1d4ed8">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#1d4ed8;#1d4ed8;#6d28d9;#1d4ed8" keyTimes="0;0.74;0.76;1" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
