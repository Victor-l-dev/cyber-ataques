<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 250" fill="none">

  <!-- ================= LEFT SIDE: ADMIN AT WORKSTATION ================= -->
  <g id="admin-workstation">
    <!-- Office Chair -->
    <!-- Backrest -->
    <path d="M36 104 C34 120 34 142 36 152" stroke="#5d5c74" stroke-width="3" stroke-linecap="round"/>
    <!-- Seat Cushion -->
    <rect x="34" y="150" width="32" height="5" rx="2" fill="#5d5c74"/>
    <!-- Central Cylinder / Stem -->
    <line x1="50" y1="155" x2="50" y2="192" stroke="#5d5c74" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Wheel Base -->
    <path d="M34 192 H66 M34 192 V196 M66 192 V196" stroke="#5d5c74" stroke-width="2" stroke-linecap="round"/>

    <!-- Desk (Positioned in front of the chair and body) -->
    <!-- Tabletop -->
    <line x1="66" y1="148" x2="136" y2="148" stroke="#1c1b2e" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Desk Leg -->
    <line x1="128" y1="148" x2="128" y2="202" stroke="#1c1b2e" stroke-width="2" stroke-linecap="round"/>

    <!-- Person -->
    <!-- Thigh / Legs under table -->
    <path d="M48 150 H74 V188" stroke="#1c1b2e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>

    <!-- Torso (Sitting on chair, leaning slightly toward computer) -->
    <path d="M46 150 C42 122 48 104 56 104 C64 104 68 122 66 150 Z" stroke="#1c1b2e" stroke-width="2" fill="#ffffff" stroke-linejoin="round"/>

    <!-- Shortened Neck (Direct subtle connection) -->
    <line x1="56" y1="104" x2="56" y2="98" stroke="#1c1b2e" stroke-width="4" stroke-linecap="round"/>

    <!-- Head (Lowered, sitting close to the shoulders) -->
    <circle cx="56" cy="87" r="11.5" stroke="#1c1b2e" stroke-width="2" fill="#ffffff"/>

    <!-- Laptop -->
    <!-- Base on desk -->
    <line x1="88" y1="146" x2="122" y2="146" stroke="#1c1b2e" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Screen Lid -->
    <line x1="118" y1="146" x2="126" y2="120" stroke="#1c1b2e" stroke-width="2" stroke-linecap="round"/>
    <!-- Screen Face / Matrix Glow -->
    <polygon points="118,146 126,120 115,122 107,146" stroke="#6d28d9" stroke-width="1.2" fill="#efe9fd">
      <animate attributeName="fill" values="#efe9fd; #efe9fd; #fee2e2; #fee2e2; #efe9fd" keyTimes="0; 0.52; 0.58; 0.88; 1" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#6d28d9; #6d28d9; #ef4444; #ef4444; #6d28d9" keyTimes="0; 0.52; 0.58; 0.88; 1" dur="4.5s" repeatCount="indefinite"/>
    </polygon>

    <!-- Code lines on laptop display -->
    <line x1="110" y1="128" x2="119" y2="126" stroke="#6d28d9" stroke-width="1" stroke-linecap="round">
      <animate attributeName="opacity" values="1; 0.3; 1; 0.2; 1" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="109" y1="135" x2="117" y2="133" stroke="#6d28d9" stroke-width="1" stroke-linecap="round">
      <animate attributeName="opacity" values="0.4; 1; 0.3; 1; 0.4" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="108" y1="141" x2="115" y2="139" stroke="#6d28d9" stroke-width="1" stroke-linecap="round">
      <animate attributeName="opacity" values="0.8; 0.2; 0.9; 0.3; 0.8" dur="0.7s" repeatCount="indefinite"/>
    </line>

    <!-- Arms -->
    <!-- Left Arm (Back) -->
    <path d="M52 110 L66 128 L88 144" stroke="#1c1b2e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.35"/>

    <!-- Right Arm (Front - Connected to shoulder and typing on keyboard) -->
    <g id="typing-arm">
      <!-- Upper Arm from shoulder (58, 108) to elbow (72, 128) -->
      <path d="M58 108 L72 128" stroke="#6d28d9" stroke-width="2.2" stroke-linecap="round"/>
      <!-- Forearm & Hand pivoting on elbow (72, 128) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 72 128; -5 72 128; 3 72 128; -4 72 128; 2 72 128; 0 72 128" dur="0.85s" repeatCount="indefinite"/>
        <path d="M72 128 L96 144" stroke="#6d28d9" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="96" cy="144" r="2.2" fill="#6d28d9"/>
      </g>
    </g>
  </g>

  <!-- ================= MIDDLE: NETWORK DATA LINK ================= -->
  <g id="network">
    <!-- Network Link Path -->
    <path d="M124 130 C160 130 185 106 225 106" stroke="#d9cdfb" stroke-width="1.6" stroke-dasharray="4 4" fill="none">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.8s" repeatCount="indefinite"/>
    </path>
    <!-- Arrow marker -->
    <path d="M168 122 L174 125 L168 128" stroke="#6d28d9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  </g>

  <!-- ================= FLYING PAYLOAD (LOGIC BOMB) ================= -->
  <g id="payload">
    <animateTransform attributeName="transform" type="translate" values="124 130; 124 130; 124 130; 225 106; 230 106; 124 130" keyTimes="0; 0.22; 0.26; 0.54; 0.58; 1" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.22; 0.26; 0.54; 0.58; 1" dur="4.5s" repeatCount="indefinite"/>
    
    <!-- Aura -->
    <circle cx="0" cy="0" r="11" fill="#efe9fd" opacity="0.85"/>
    <!-- Core Payload Orb -->
    <circle cx="0" cy="0" r="7.5" fill="#6d28d9">
      <animate attributeName="fill" values="#6d28d9; #6d28d9; #ef4444; #ef4444; #6d28d9" keyTimes="0; 0.45; 0.54; 0.88; 1" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Inner Spark / Core -->
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    <line x1="0" y1="-7.5" x2="0" y2="-11.5" stroke="#6d28d9" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="stroke" values="#6d28d9; #6d28d9; #ef4444; #ef4444; #6d28d9" keyTimes="0; 0.45; 0.54; 0.88; 1" dur="4.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ================= RIGHT SIDE: TARGET SERVER RACK ================= -->
  <g id="server">
    <!-- Jitter / vibration on detonation -->
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; -2 1; 3 -1; -2 -1; 2 1; -1 0; 0 0; 0 0" keyTimes="0; 0.54; 0.56; 0.58; 0.60; 0.62; 0.64; 0.68; 1" dur="4.5s" repeatCount="indefinite"/>

    <!-- Shockwave ring on detonation -->
    <circle cx="280" cy="106" r="10" fill="none" stroke="#ef4444" opacity="0">
      <animate attributeName="r" values="10; 10; 65; 70" keyTimes="0; 0.54; 0.72; 1" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 0; 0.85; 0" keyTimes="0; 0.54; 0.58; 0.75" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="2.2; 2.2; 0.5; 0.5" keyTimes="0; 0.54; 0.72; 1" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- 3 Server Rack Units -->
    <!-- Unit 1 (Top) -->
    <rect x="225" y="48" width="110" height="32" rx="4" stroke="#6d28d9" stroke-width="1.6" fill="#ffffff">
      <animate attributeName="stroke" values="#6d28d9; #6d28d9; #ef4444; #ef4444; #6d28d9" keyTimes="0; 0.54; 0.58; 0.88; 0.96" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#ffffff; #ffffff; #fef2f2; #fef2f2; #ffffff" keyTimes="0; 0.54; 0.58; 0.88; 0.96" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="242" cy="64" r="3" fill="#6d28d9">
      <animate attributeName="fill" values="#6d28d9; #6d28d9; #ef4444; #ef4444; #6d28d9" keyTimes="0; 0.54; 0.58; 0.88; 0.96" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="254" cy="64" r="3" fill="#6d28d9">
      <animate attributeName="fill" values="#6d28d9; #6d28d9; #ef4444; #ef4444; #6d28d9" keyTimes="0; 0.54; 0.58; 0.88; 0.96" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1; 1; 0.2; 1; 0.2; 1; 0.2; 1; 1" keyTimes="0; 0.54; 0.58; 0.63; 0.68; 0.74; 0.80; 0.86; 0.96" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <line x1="272" y1="64" x2="318" y2="64" stroke="#e6e4f0" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Unit 2 (Middle) -->
    <rect x="225" y="90" width="110" height="32" rx="4" stroke="#6d28d9" stroke-width="1.6" fill="#ffffff">
      <animate attributeName="stroke" values="#6d28d9; #6d28d9; #ef4444; #ef4444; #6d28d9" keyTimes="0; 0.54; 0.58; 0.88; 0.96" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#ffffff; #ffffff; #fef2f2; #fef2f2; #ffffff" keyTimes="0; 0.54; 0.58; 0.88; 0.96" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="242" cy="106" r="3" fill="#6d28d9">
      <animate attributeName="fill" values="#6d28d9; #6d28d9; #ef4444; #ef4444; #6d28d9" keyTimes="0; 0.54; 0.58; 0.88; 0.96" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="254" cy="106" r="3" fill="#6d28d9">
      <animate attributeName="fill" values="#6d28d9; #6d28d9; #ef4444; #ef4444; #6d28d9" keyTimes="0; 0.54; 0.58; 0.88; 0.96" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1; 1; 0.2; 1; 0.2; 1; 0.2; 1; 1" keyTimes="0; 0.54; 0.58; 0.63; 0.68; 0.74; 0.80; 0.86; 0.96" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <line x1="272" y1="106" x2="318" y2="106" stroke="#e6e4f0" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Unit 3 (Bottom) -->
    <rect x="225" y="132" width="110" height="32" rx="4" stroke="#6d28d9" stroke-width="1.6" fill="#ffffff">
      <animate attributeName="stroke" values="#6d28d9; #6d28d9; #ef4444; #ef4444; #6d28d9" keyTimes="0; 0.54; 0.58; 0.88; 0.96" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#ffffff; #ffffff; #fef2f2; #fef2f2; #ffffff" keyTimes="0; 0.54; 0.58; 0.88; 0.96" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="242" cy="148" r="3" fill="#6d28d9">
      <animate attributeName="fill" values="#6d28d9; #6d28d9; #ef4444; #ef4444; #6d28d9" keyTimes="0; 0.54; 0.58; 0.88; 0.96" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="254" cy="148" r="3" fill="#6d28d9">
      <animate attributeName="fill" values="#6d28d9; #6d28d9; #ef4444; #ef4444; #6d28d9" keyTimes="0; 0.54; 0.58; 0.88; 0.96" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1; 1; 0.2; 1; 0.2; 1; 0.2; 1; 1" keyTimes="0; 0.54; 0.58; 0.63; 0.68; 0.74; 0.80; 0.86; 0.96" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <line x1="272" y1="148" x2="318" y2="148" stroke="#e6e4f0" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Warning / Alarm Triangle (Bottom Icon) -->
    <g opacity="0.35">
      <animate attributeName="opacity" values="0.35; 0.35; 1; 0.4; 1; 0.85; 0.35" keyTimes="0; 0.54; 0.58; 0.68; 0.78; 0.88; 0.96" dur="4.5s" repeatCount="indefinite"/>
      <path d="M280 182 L306 226 H254 Z" stroke="#6d28d9" stroke-width="1.8" stroke-linejoin="round" fill="#ffffff">
        <animate attributeName="stroke" values="#6d28d9; #6d28d9; #ef4444; #dc2626; #ef4444; #6d28d9" keyTimes="0; 0.54; 0.58; 0.72; 0.88; 0.96" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#ffffff; #ffffff; #fee2e2; #fef2f2; #ffffff" keyTimes="0; 0.54; 0.58; 0.72; 0.88; 0.96" dur="4.5s" repeatCount="indefinite"/>
      </path>
      <path d="M280 194 V209" stroke="#6d28d9" stroke-width="1.8" stroke-linecap="round">
        <animate attributeName="stroke" values="#6d28d9; #6d28d9; #ef4444; #dc2626; #ef4444; #6d28d9" keyTimes="0; 0.54; 0.58; 0.72; 0.88; 0.96" dur="4.5s" repeatCount="indefinite"/>
      </path>
      <circle cx="280" cy="217" r="1.6" fill="#6d28d9">
        <animate attributeName="fill" values="#6d28d9; #6d28d9; #ef4444; #dc2626; #ef4444; #6d28d9" keyTimes="0; 0.54; 0.58; 0.72; 0.88; 0.96" dur="4.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
